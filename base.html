<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title or "Movie Booking" }}</title>
    <!-- ✅ Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(120deg, #0d1b2a, #1b263b);
            color: #fff;
            min-height: 100vh;
        }
        .navbar {
            background-color: #1b263b;
        }
        .card {
            background-color: #415a77;
            border: none;
            border-radius: 15px;
        }
        .btn-primary {
            background-color: #e0aaff;
            border: none;
        }
        .btn-primary:hover {
            background-color: #c77dff;
        }
        a {
            color: #ffd6ff;
        }
        a:hover {
            color: #c77dff;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark px-3">
        <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">🎬 Movie Booking</a>
        <div class="ms-auto">
            <a class="nav-link d-inline text-light" href="{{ url_for('movies') }}">Movies</a>
            <a class="nav-link d-inline text-light" href="{{ url_for('bookings') }}">Bookings</a>
        </div>
    </nav>
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
